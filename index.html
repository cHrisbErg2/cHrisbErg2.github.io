<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("portfolio-theme");
          var meta = document.querySelector('meta[name="color-scheme"]');
          if (stored === "light" || stored === "dark") {
            if (meta) meta.setAttribute("content", stored);
            document.documentElement.dataset.theme = stored;
          } else {
            if (meta) meta.setAttribute("content", "light dark");
            var prefersDark =
              typeof window.matchMedia === "function" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = prefersDark ? "dark" : "light";
          }
        } catch (_err) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

    <title>Christian Muhirwa — Real-Time Speech AI &amp; IkiLang Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Christian Muhirwa (University of Saskatchewan), builder of IkiLang / KinyaVoice: live Kinyarwanda-to-English captions in +1.02 s over WebSockets, 451 passing tests, and zero user tracking."
    />
    <meta name="author" content="Christian Muhirwa" />
    <meta name="theme-color" content="#f7f8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101713" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://chrisberg2.github.io/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
