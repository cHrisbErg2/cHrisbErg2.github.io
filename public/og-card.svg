    <text x="35" y="26.5" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#192b23">420+ Automated Tests</text>

    <rect x="226" y="0" width="216" height="44" rx="12" fill="#eef1eb" stroke="#dce2db" />
