  <rect x="32" y="32" width="1136" height="566" rx="20" fill="#ffffff" stroke="#dce2db" stroke-width="2" />

  <!-- Top accent bar -->
  <rect x="32" y="32" width="1136" height="10" rx="5" fill="#245c43" />

