    <text x="46" y="267" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f0f4ee">3. Evaluation &amp; Zero-PII Gate</text>
    <text x="46" y="288" font-family="ui-monospace, monospace" font-size="12" fill="#bfd6b0">Anonymous Sessions · Graceful Fallback</text>

    <!-- Connector -->
    <line x1="176" y1="302" x2="176" y2="326" stroke="#bfd6b0" stroke-width="2" stroke-opacity="0.6" />

