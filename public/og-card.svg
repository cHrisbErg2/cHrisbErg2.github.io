    <text x="70" y="23" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#192b23" letter-spacing="-0.4">Christian Muhirwa</text>
    <text x="70" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#59665e">University of Saskatchewan · Applied Speech AI &amp; Systems</text>
  </g>

